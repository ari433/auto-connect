name: Encar direct sync

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

concurrency:
  group: encar-direct-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: npx prisma generate

      - run: npm run db:sync:direct
